name: Production

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  push-prod:
    name: Push image (prod)
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    environment: production
    permissions:
      contents: write
      id-token: write
      pull-requests: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeddius
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zeddius

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: 3410763
          private-key: ${{ secrets.ACTIONS_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Read version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> $GITHUB_OUTPUT

      - name: Setup GCP
        uses: zeddiushq/github-actions/setup-gcp@main
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          registry: us-central1-docker.pkg.dev

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run migrations (CI database)
        run: sqlx migrate run

      - name: Build and push Docker image
        run: |
          docker build --network=host --build-arg DATABASE_URL \
            -t us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/docker/zeddius-api:${{ steps.version.outputs.version }} .
          docker push us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/docker/zeddius-api:${{ steps.version.outputs.version }}

      - name: Tag release
        run: |
          git config user.name "zeddius-actions[bot]"
          git config user.email "zeddius-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create v${{ steps.version.outputs.version }} \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Bump version
        run: |
          cargo install cargo-edit
          cargo set-version --bump patch
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          git push

  push-dev:
    name: Push image (dev)
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    environment: development
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeddius
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zeddius

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> $GITHUB_OUTPUT

      - name: Setup GCP
        uses: zeddiushq/github-actions/setup-gcp@main
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          registry: us-central1-docker.pkg.dev

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run migrations (CI database)
        run: sqlx migrate run

      - name: Build and push Docker image
        run: |
          docker build --network=host --build-arg DATABASE_URL \
            -t us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/docker/zeddius-api:${{ steps.version.outputs.version }} .
          docker push us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/docker/zeddius-api:${{ steps.version.outputs.version }}
