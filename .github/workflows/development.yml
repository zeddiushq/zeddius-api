name: Development

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: 3410763
          private-key: ${{ secrets.ACTIONS_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup GCP
        uses: zeddiushq/github-actions/setup-gcp@main
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}
          registry: us-central1-docker.pkg.dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build and push Docker image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/docker/zeddius-api:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/docker/zeddius-api:${{ github.sha }}

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cargo install sqlx-cli --no-default-features --features rustls,postgres
          sqlx migrate run

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy zeddius-api \
            --image us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/docker/zeddius-api:${{ github.sha }} \
            --region us-central1 \
            --project ${{ vars.GCP_PROJECT }} \
            --service-account ${{ vars.RUNTIME_SERVICE_ACCOUNT }} \
            --platform managed \
            --port 8080 \
            --ingress all \
            --allow-unauthenticated \
            --execution-environment gen2 \
            --memory ${{ vars.CLOUD_RUN_MEMORY }} \
            --cpu 1 \
            --min-instances ${{ vars.CLOUD_RUN_MIN_INSTANCES }} \
            --max-instances ${{ vars.CLOUD_RUN_MAX_INSTANCES }} \
            --timeout 300 \
            --set-env-vars APPLE_BUNDLE_ID=${{ vars.APPLE_BUNDLE_ID }},APPLE_SERVICES_ID=${{ vars.APPLE_SERVICES_ID }},RESEND_FROM_EMAIL=${{ vars.RESEND_FROM_EMAIL }} \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,RESEND_API_KEY=RESEND_API_KEY:latest \
            --quiet
